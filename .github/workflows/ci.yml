name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libbullet-dev python3

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Native tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Python regression harness
        run: python3 scripts/run_tests.py

      - name: Analytic validation
        run: python3 scripts/validate_physics.py
